<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{CSP_SOURCE}}; script-src 'nonce-{{NONCE}}' {{CSP_SOURCE}}; connect-src {{CSP_SOURCE}};">
    <link rel="stylesheet" href="{{SHARED_STYLE_URI}}">
    <script type="importmap" nonce="{{NONCE}}">
    {"imports":{"three":"{{THREE_URI}}","three/addons/":"{{THREE_ADDONS_URI}}"}}
    </script>
    <title>Infinite Skeleton Editor</title>
</head>
<body data-ie-editor="skeleton">
    <div id="app">
        <header id="toolbar" role="toolbar" aria-label="Skeleton controls">
            <div><strong id="asset-name">Skeleton</strong><span id="summary">Loading…</span></div>
            <nav id="actions">
                <button id="grid" title="Grid" aria-label="Grid"><ion-icon name="grid-outline"></ion-icon></button>
                <button id="fit" title="Fit Skeleton" aria-label="Fit Skeleton"><ion-icon name="scan-outline"></ion-icon></button>
                <button id="reload" title="Reload" aria-label="Reload"><ion-icon name="refresh-outline"></ion-icon></button>
                <button id="save" title="Save Changes" aria-label="Save Changes" disabled><ion-icon name="save-outline"></ion-icon></button>
            </nav>
        </header>
        <main>
            <aside class="hierarchy-panel">
                <h2>HIERARCHY</h2>
                <div id="hierarchy"></div>
            </aside>
            <section id="viewport"></section>
            <aside class="inspector">
                <h2>NODE INSPECTOR</h2>
                <div id="empty">Select a skeleton node.</div>
                <div id="fields" hidden>
                    <label>Name<input id="node-name" type="text"></label>
                    <div class="metadata"><span>Type</span><b id="node-type"></b></div>
                    <div class="metadata"><span>Bone Index</span><b id="bone-index"></b></div>
                    <h3>POSITION</h3><div id="position" class="vector"></div>
                    <h3>QUATERNION</h3><div id="quaternion" class="vector four"></div>
                    <h3>SCALE</h3><div id="scale" class="vector"></div>
                    <h3>INVERSE BIND MATRIX</h3><pre id="inverse">Not a skin bone</pre>
                </div>
            </aside>
        </main>
        <footer id="status">Loading skeleton…</footer>
    </div>
    <script nonce="{{NONCE}}" type="module" src="{{SHARED_UI_URI}}"></script>
    <script nonce="{{NONCE}}" type="module" src="{{SCRIPT_URI}}"></script>
</body>
</html>
