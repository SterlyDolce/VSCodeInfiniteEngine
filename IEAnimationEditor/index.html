
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="
            default-src 'none';
            img-src {{CSP_SOURCE}} data: blob:;
            style-src {{CSP_SOURCE}} 'unsafe-inline';
            script-src 'nonce-{{NONCE}}' {{CSP_SOURCE}};
            connect-src {{CSP_SOURCE}};
        "
    >

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link rel="stylesheet" href="{{SHARED_STYLE_URI}}">

    <script type="importmap" nonce="{{NONCE}}">
    {
        "imports": {
            "three": "{{THREE_URI}}",
            "three/addons/": "{{THREE_ADDONS_URI}}"
        }
    }
    </script>

    <title>Infinite Animation Editor</title>
</head>

<body data-ie-editor="animation-timeline">
    <div id="app">
        <header id="toolbar" class="toolbar" role="toolbar" aria-label="Animation controls">
            <div class="heading">
                <strong id="animation-name">Animation</strong>
                <span id="animation-info">No clip loaded</span>
            </div>

            <div id="actions" class="toolbar-actions">
                <button id="choose-actor" title="Choose Preview Actor" aria-label="Choose Preview Actor"><ion-icon name="person-outline"></ion-icon></button>
                <button id="save" title="Save Changes" aria-label="Save Changes" disabled><ion-icon name="save-outline"></ion-icon></button>
            </div>
        </header>

        <main class="main">
            <section class="preview-area">
                <div id="viewport"></div>
                <div class="preview-label" id="actor-name">
                    No preview Actor selected
                </div>
            </section>

            <aside class="inspector">
                <div class="section-title">KEYFRAME INSPECTOR</div>
                <div id="selection-info">
                    Select a keyframe on the timeline.
                </div>
                <div id="keyframe-fields"></div>
            </aside>
        </main>

        <section class="timeline-panel">
            <div class="playback">
                <button id="stop" title="Stop" aria-label="Stop"><ion-icon name="stop"></ion-icon></button>
                <button id="play" title="Play / Pause" aria-label="Play"><ion-icon name="play"></ion-icon></button>

                <span id="time-label">0.00 / 0.00s</span>

                <label>
                    Speed
                    <input
                        id="speed"
                        type="number"
                        value="1"
                        min="0.1"
                        max="4"
                        step="0.1"
                    >
                </label>

                <label>
                    <input id="loop" type="checkbox" checked>
                    Loop
                </label>
            </div>

            <input
                id="scrubber"
                type="range"
                min="0"
                max="1"
                value="0"
                step="0.001"
            >

            <div class="track-heading">
                <span>TRACKS / KEYFRAMES</span>
                <span>Click a diamond to edit its value</span>
            </div>

            <div id="tracks"></div>
        </section>

        <div id="status"></div>
    </div>

    <script type="module" nonce="{{NONCE}}" src="{{SHARED_UI_URI}}"></script>
    <script
        nonce="{{NONCE}}"
        type="module"
        src="{{SCRIPT_URI}}">
    </script>
</body>
</html>
