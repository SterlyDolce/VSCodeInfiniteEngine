<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{SHARED_STYLE_URI}}">
</head>

<body data-ie-editor="scene-viewport">
    <div id="viewport"></div>
    <canvas id="gameplay-ui" aria-label="Gameplay user interface"></canvas>
    <div id="preview-viewport"></div>
    <div id="toolbar" role="toolbar" aria-label="Viewport controls">
        <div id="actions">
        <select id="viewport-view" title="Camera view" aria-label="Camera view">
            <option value="perspective">Perspective</option>
            <option value="top">Top</option>
            <option value="bottom">Bottom</option>
            <option value="front">Front</option>
            <option value="back">Back</option>
            <option value="left">Left</option>
            <option value="right">Right</option>
        </select>
        </div>
        <span id="viewport-title">Viewport</span>
        <div id="actions">
        <button class="transform-mode active" data-mode="translate" title="Move (W)" aria-label="Move"><ion-icon name="move-outline"></ion-icon></button>
        <button class="transform-mode" data-mode="rotate" title="Rotate (E)" aria-label="Rotate"><ion-icon name="sync-outline"></ion-icon></button>
        <button class="transform-mode" data-mode="scale" title="Scale (R)" aria-label="Scale"><ion-icon name="resize-outline"></ion-icon></button>
        <button id="transform-space" title="Transform space: World" aria-label="Transform space: World"><ion-icon name="globe-outline"></ion-icon></button>
        <span class="toolbar-separator"></span>
        <button id="translation-snap" class="toggle" title="Toggle position snapping" aria-label="Toggle position snapping"><ion-icon name="grid-outline"></ion-icon></button>
        <select id="translation-snap-value" title="Position snap size" aria-label="Position snap size">
            <option value="0.1">0.1</option>
            <option value="0.5">0.5</option>
            <option value="1" selected>1</option>
            <option value="5">5</option>
            <option value="10">10</option>
        </select>
        <button id="rotation-snap" class="toggle" title="Toggle rotation snapping" aria-label="Toggle rotation snapping"><ion-icon name="compass-outline"></ion-icon></button>
        <select id="rotation-snap-value" title="Rotation snap angle" aria-label="Rotation snap angle">
            <option value="5">5°</option>
            <option value="10">10°</option>
            <option value="15" selected>15°</option>
            <option value="30">30°</option>
            <option value="45">45°</option>
        </select>
        <span class="toolbar-separator"></span>
        <label class="speed-control" title="Fly camera speed"><ion-icon name="speedometer-outline"></ion-icon>
            <select id="camera-speed" aria-label="Fly camera speed">
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="8" selected>8</option>
                <option value="16">16</option>
                <option value="32">32</option>
                <option value="64">64</option>
            </select>
        </label>
        </div>
    </div>
    <div id="view-gizmo"></div>

    <script>
        window.INFINITE_ASSETS = {
            cameraModel: '{{CAMERA_MODEL_URI}}',
            viewGizmoModel: '{{VIEW_GIZMO_MODEL_URI}}',
			checkerTexture: '{{CHECKER_TEXTURE_URI}}',
			rapierModule: '{{RAPIER_URI}}'

        };
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "{{THREE_URI}}",
				"three/addons/": "{{THREE_ADDONS_URI}}/"
            }
        }
    </script>

    <script type="module" src="{{SHARED_UI_URI}}"></script>
    <script type="module" src="{{SCRIPT_URI}}"></script>
</body>

</html>
